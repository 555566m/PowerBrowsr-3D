name: Build Power Browser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Power Browser APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP & Locate Gradle Project Root
        id: setup_proj
        run: |
          mkdir -p /tmp/extracted
          for z in *.zip */*.zip; do
            if [ -f "$z" ]; then
              unzip -qo "$z" -d /tmp/extracted
            fi
          done

          if [ ! -f "settings.gradle" ] && [ ! -f "build.gradle" ]; then
            if [ -f "/tmp/extracted/settings.gradle" ] || [ -f "/tmp/extracted/build.gradle" ]; then
              cp -rn /tmp/extracted/* .
            else
              FOUND_GRADLE=$(find /tmp/extracted -maxdepth 4 -name "settings.gradle" -o -name "build.gradle" | head -n 1)
              if [ -n "$FOUND_GRADLE" ]; then
                cp -rn "$(dirname "$FOUND_GRADLE")"/* .
              fi
            fi
          fi

          if [ -f "settings.gradle" ] || [ -f "build.gradle" ]; then
            PROJ_DIR="$(pwd)"
          else
            SUB_GRADLE=$(find "$(pwd)" -maxdepth 4 -name "settings.gradle" -o -name "build.gradle" | head -n 1)
            if [ -z "$SUB_GRADLE" ]; then
              echo "ERROR: settings.gradle or build.gradle not found!"
              exit 1
            fi
            PROJ_DIR="$(dirname "$SUB_GRADLE")"
          fi

          echo "Gradle project directory: $PROJ_DIR"
          ls -la "$PROJ_DIR"
          echo "proj_dir=$PROJ_DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_ROOT" > "${{ steps.setup_proj.outputs.proj_dir }}/local.properties"
          mkdir -p "$SDK_ROOT/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "d975f751698a77b662f1254ddbeed3901e976f5a\n" > "$SDK_ROOT/licenses/intel-android-extra-license"
          SDKMANAGER=$(find "$SDK_ROOT" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            set +e
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            set -e
          fi

      - name: Generate Gradle 8.5 Wrapper
        working-directory: ${{ steps.setup_proj.outputs.proj_dir }}
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.setup_proj.outputs.proj_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerBrowser-3D-Edition-APK
          path: ${{ steps.setup_proj.outputs.proj_dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
