name: Build Power Browser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Power Browser APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP if present in repository
        run: |
          mkdir -p /tmp/extracted_project
          for z in *.zip */*.zip; do
            if [ -f "$z" ]; then
              unzip -qo "$z" -d /tmp/extracted_project
            fi
          done
          if [ -f "build.gradle" ] || [ -f "settings.gradle" ]; then
            echo "Project files already at repo root."
          elif [ -f "/tmp/extracted_project/build.gradle" ] || [ -f "/tmp/extracted_project/settings.gradle" ]; then
            cp -rn /tmp/extracted_project/* .
          else
            SUB_GRADLE=$(find /tmp/extracted_project -maxdepth 3 -name "build.gradle" -o -name "settings.gradle" | head -n 1)
            if [ -n "$SUB_GRADLE" ]; then
              SRC_DIR=$(dirname "$SUB_GRADLE")
              cp -rn "$SRC_DIR"/* .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Generate Gradle 8.5 Wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerBrowser-3D-Edition-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
