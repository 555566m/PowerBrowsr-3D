name: Build Power Browser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Power Browser APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP if present in repository
        run: |
          mkdir -p /tmp/extracted_project
          for z in *.zip */*.zip; do
            if [ -f "$z" ]; then
              unzip -qo "$z" -d /tmp/extracted_project
            fi
          done
          if [ ! -f "build.gradle" ] && [ ! -f "settings.gradle" ]; then
            if [ -f "/tmp/extracted_project/build.gradle" ] || [ -f "/tmp/extracted_project/settings.gradle" ]; then
              cp -rn /tmp/extracted_project/* .
            else
              SUB_GRADLE=$(find /tmp/extracted_project -maxdepth 3 -name "build.gradle" -o -name "settings.gradle" | head -n 1)
              if [ -n "$SUB_GRADLE" ]; then
                cp -rn "$(dirname "$SUB_GRADLE")"/* .
              fi
            fi
          fi
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's|@mipmap/ic_launcher|@drawable/ic_power_logo_3d|g' app/src/main/AndroidManifest.xml
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          mkdir -p "$SDK_ROOT/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "d975f751698a77b662f1254ddbeed3901e976f5a\n" > "$SDK_ROOT/licenses/intel-android-extra-license"
          SDKMANAGER=$(find "$SDK_ROOT" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            set +e
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
            set -e
          fi

      - name: Generate Gradle 8.5 Wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerBrowser-3D-Edition-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
